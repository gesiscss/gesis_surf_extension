sonar.organization=gesiscss-1
sonar.projectKey=gesiscss_gesis_surf_extension
sonar.host.url=https://sonarcloud.io

# Exclude test files from copy-paste detection.
# Test code naturally has repetitive assertion/mock patterns that are not
# meaningful duplication and should not count toward the quality gate.
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports generated by vitest --coverage (lcov format)
sonar.javascript.lcov.reportPaths=chrome-extension/coverage/lcov.info,pages/content/coverage/lcov.info,packages/shared/coverage/lcov.info

# Exclude test files and config files from coverage measurement
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/vitest.config.ts,**/vite.config.ts
