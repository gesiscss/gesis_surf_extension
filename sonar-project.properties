sonar.organization=gesiscss
sonar.projectKey=gesiscss_gesis_surf_extension
sonar.host.url=https://sonarcloud.io

# Exclude test files from copy-paste detection.
# Test code naturally has repetitive assertion/mock patterns that are not
# meaningful duplication and should not count toward the quality gate.
sonar.cpd.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
